name: release

# Builds every platform when a version tag (v*) is pushed and attaches the
# binaries to a GitHub Release. Tags only — there is deliberately no
# workflow_dispatch: a release must never be published from a moving ref.

on:
  push:
    tags:
      - "v*"

# Never cancel a release run: a cancelled release must not leave a partial
# public release behind. Group by ref so a re-pushed tag waits for the
# previous run of the same tag instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 5
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    # The code is tested and linted before any artifact is built, so a broken
    # tag wastes no matrix compute.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gate
      - run: cargo fmt --all -- --check
      # CLI + MCP server only — the macOS release build
      - run: cargo clippy --locked --workspace --no-default-features -- -D warnings
      # default features: the viewer build the Linux and Windows releases ship
      - run: cargo clippy --locked --workspace -- -D warnings
      - run: cargo test --locked --workspace --no-default-features
      - run: cargo test --locked --workspace

  linux-x86_64:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-linux-x64
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # rust-toolchain.toml installs the compiler but not cross targets
      - run: rustup target add x86_64-unknown-linux-musl
      # the desktop binary, like the Windows exe: viewer + CLI + MCP server
      # in one. It links libc, libm and libgcc only — the GUI stack is
      # dlopen()'d at runtime. Built on Ubuntu 24.04 (glibc 2.39), the
      # actual glibc floor of these binaries and the AppImage.
      - run: cargo build --locked --workspace --release
      - run: |
          mkdir -p dist
          cp target/release/apkscope dist/apkscope_linux_x86_64
      # the same binary, packaged: .deb for Debian/Ubuntu, AppImage as a
      # portable format for distros whose glibc meets the floor above
      - run: packaging/linux/package.sh target/release/apkscope dist
      # the fully static CLI + MCP server for servers, containers and musl
      # distros (Alpine); no viewer — a static binary cannot dlopen() the
      # desktop's X11/Wayland/GL stack, and the binary says so when asked
      - run: cargo build --locked --workspace --release --no-default-features --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - run: cp target/x86_64-unknown-linux-musl/release/apkscope dist/apkscope_linux_musl_x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-x86_64
          path: dist/
          if-no-files-found: error

  linux-aarch64:
    needs: gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-linux-arm64
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # rust-toolchain.toml installs the compiler but not cross targets
      - run: rustup target add aarch64-unknown-linux-musl
      - run: cargo build --locked --workspace --release
      - run: |
          mkdir -p dist
          cp target/release/apkscope dist/apkscope_linux_aarch64
      - run: packaging/linux/package.sh target/release/apkscope dist
      - run: cargo build --locked --workspace --release --no-default-features --target aarch64-unknown-linux-musl
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - run: cp target/aarch64-unknown-linux-musl/release/apkscope dist/apkscope_linux_musl_aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-aarch64
          path: dist/
          if-no-files-found: error

  macos:
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # the oldest macOS the prebuilt Rust toolchain supports today; raise or
      # lower deliberately and test on the target version
      MACOSX_DEPLOYMENT_TARGET: "12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-macos
      # rust-toolchain.toml installs the compiler but not cross targets
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # arm64 native, x86_64 cross with the Apple toolchain; both are the
      # shipped macOS configuration (CLI + MCP server only)
      - run: cargo build --locked --workspace --release --no-default-features --target aarch64-apple-darwin
      - run: cargo build --locked --workspace --release --no-default-features --target x86_64-apple-darwin
      - run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/apkscope dist/apkscope_macos_aarch64
          cp target/x86_64-apple-darwin/release/apkscope dist/apkscope_macos_x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos
          path: dist/
          if-no-files-found: error

  windows:
    needs: gate
    # one binary — viewer + CLI + MCP server
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-windows
      - run: cargo build --locked --workspace --release
      # canonical lowercase Cargo output path; bash handles the copy like POSIX CI
      - shell: bash
        run: |
          mkdir -p dist
          cp target/release/apkscope.exe dist/apkscope_windows_x86_64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          path: dist/
          if-no-files-found: error

  release:
    needs: [linux-x86_64, linux-aarch64, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # exact expected asset set — the public contract; a missing or extra
      # file fails the release before anything is published
      - name: Verify the complete asset manifest
        run: |
          v="${GITHUB_REF_NAME#v}"
          mapfile -t expected <<EOF
          apkscope_linux_x86_64
          apkscope_linux_musl_x86_64
          apkscope_linux_aarch64
          apkscope_linux_musl_aarch64
          apkscope_${v}_amd64.deb
          apkscope_${v}_arm64.deb
          apkscope-${v}-x86_64.AppImage
          apkscope-${v}-aarch64.AppImage
          apkscope_macos_aarch64
          apkscope_macos_x86_64
          apkscope_windows_x86_64.exe
          EOF
          missing=0
          for f in "${expected[@]}"; do
            [ -f "dist/$f" ] || { echo "::error::missing release asset dist/$f"; missing=1; }
          done
          # nothing else may ride along
          for f in dist/*; do
            base=$(basename "$f")
            case " ${expected[*]} " in
              *" $base "*) ;;
              *) echo "::error::unexpected file in dist/: $base"; missing=1 ;;
            esac
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "manifest ok:"; ls -l dist
      - name: Checksums
        run: |
          cd dist || exit 1
          # deterministic order; covers exactly the manifest above
          v="${GITHUB_REF_NAME#v}"
          sha256sum \
            apkscope_linux_x86_64 apkscope_linux_musl_x86_64 \
            apkscope_linux_aarch64 apkscope_linux_musl_aarch64 \
            "apkscope_${v}_amd64.deb" "apkscope_${v}_arm64.deb" \
            "apkscope-${v}-x86_64.AppImage" "apkscope-${v}-aarch64.AppImage" \
            apkscope_macos_aarch64 apkscope_macos_x86_64 \
            apkscope_windows_x86_64.exe > checksums.txt
          cat checksums.txt
      # prerelease only for real pre-release suffixes (-rc.1, -beta.1, ...),
      # not for any hyphen anywhere in the tag
      - name: Decide prerelease
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/apkscope*
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.prerelease.outputs.prerelease == 'true' }}
