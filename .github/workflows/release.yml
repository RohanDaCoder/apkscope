name: release

# Builds every platform when a version tag (v*) is pushed and attaches the
# binaries to a GitHub Release. "-" in the tag name (e.g. v0.9.1-rc.1)
# publishes as a pre-release. Linux ships two binaries per arch: the glibc
# build with the viewer, the CLI and the MCP server together (also packaged
# as .deb and AppImage), and the static musl CLI + MCP server for servers,
# containers and Alpine — no viewer there, a fully static binary cannot
# dlopen() the desktop's X11/Wayland/GL stack, and the binary says so when
# asked. Windows ships the viewer exe per arch, macOS the CLI + MCP build. The
# lint job gates the matrix so a broken tag wastes no compute.
on:
  push:
    tags:
      - "v*"

jobs:
  lint:
    runs-on: ubuntu-24.04
    # checks both feature configs now; the viewer tree adds a few minutes
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      # CLI + MCP server only — the macOS release build
      - run: cargo check --release --no-default-features
      # the default-feature build — what Linux and Windows releases ship
      # (viewer + CLI + MCP server in one binary); compiles with no system GUI
      # packages, since the desktop's X11/Wayland/GL are dlopen()'d at runtime
      - run: cargo check --release
      - run: cargo clippy --release --no-default-features -- -D warnings

  linux:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        # both arches build on the x86_64 runner: aarch64 cross-compiles with
        # gcc-aarch64-linux-gnu (glibc build; links nothing beyond libc, the GUI
        # stack is dlopen()'d at runtime) and a musl container (musl build;
        # Ubuntu's musl-tools only ships the host arch's musl-gcc)
        include:
          - { arch: x86_64 }
          - { arch: aarch64 }
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      # the desktop binary, like the Windows exe: viewer + CLI + MCP server
      # in one. It links nothing beyond libc — X11, Wayland and GL are
      # dlopen()'d at runtime — and 24.04 is the oldest supported LTS, so
      # the glibc it needs is the floor every newer distro meets.
      - run: sudo apt-get install -y gcc-aarch64-linux-gnu
        if: matrix.arch == 'aarch64'
      - run: cargo build --release
        if: matrix.arch == 'x86_64'
      - run: cargo build --release --target aarch64-unknown-linux-gnu
        if: matrix.arch == 'aarch64'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - run: |
          mkdir -p dist
          cp target/release/apkscope dist/apkscope_linux_x86_64
        if: matrix.arch == 'x86_64'
      - run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/apkscope dist/apkscope_linux_aarch64
        if: matrix.arch == 'aarch64'
      # the same binary, packaged: .deb for Debian/Ubuntu, AppImage for any distro.
      # TARGETARCH tells package.sh which arch the binary is for — the packaging
      # runner's uname -m is the host's, not the binary's.
      - run: packaging/linux/package.sh target/release/apkscope dist
        if: matrix.arch == 'x86_64'
      - run: packaging/linux/package.sh target/aarch64-unknown-linux-gnu/release/apkscope dist
        if: matrix.arch == 'aarch64'
        env:
          TARGETARCH: aarch64
      # the CLI + MCP server for servers, containers and musl distros (Alpine):
      # fully static. No viewer — a static binary cannot dlopen() the desktop's
      # X11/Wayland/GL stack — and asking it for the gui prints that limitation
      # instead of a bare error. x86_64 uses the host's musl-tools; aarch64
      # builds in a musl cross container (musl-tools has no arm64 cross).
      - run: sudo apt-get install -y musl-tools
        if: matrix.arch == 'x86_64'
      - run: cargo build --release --no-default-features --target x86_64-unknown-linux-musl
        if: matrix.arch == 'x86_64'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - run: |
          docker run --rm -v "$PWD:/home/rust/src" -w /home/rust/src \
            ghcr.io/rust-cross/rust-musl-cross:aarch64-musl \
            cargo build --release --no-default-features --target aarch64-unknown-linux-musl
        if: matrix.arch == 'aarch64'
      - run: cp target/x86_64-unknown-linux-musl/release/apkscope dist/apkscope_linux_musl_x86_64
        if: matrix.arch == 'x86_64'
      - run: sudo chown -R "$(id -u):$(id -g)" target dist
        if: matrix.arch == 'aarch64'
      - run: cp target/aarch64-unknown-linux-musl/release/apkscope dist/apkscope_linux_musl_aarch64
        if: matrix.arch == 'aarch64'
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/

  macos:
    needs: [lint]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # arm64 build is native; x86_64 cross-compiles with the Apple toolchain
      - run: cargo build --release --no-default-features --target aarch64-apple-darwin
      - run: cargo build --release --no-default-features --target x86_64-apple-darwin
      - run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/apkscope dist/apkscope_macos_aarch64
          cp target/x86_64-apple-darwin/release/apkscope dist/apkscope_macos_x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/

  windows:
    needs: [lint]
    # one binary per arch — viewer + CLI + MCP server — built where it is tested
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      # x64 build is native; aarch64 cross-compiles with the MSVC toolchain
      - run: cargo build --release
      - run: cargo build --release --target aarch64-pc-windows-msvc
      - run: |
          mkdir dist
          cp target/Release/apkscope.exe dist/apkscope_windows_x86_64.exe
          cp target/aarch64-pc-windows-msvc/Release/apkscope.exe dist/apkscope_windows_aarch64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum apkscope* > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v3.0.4
        with:
          files: |
            dist/apkscope*
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
