name: release

# One pipeline, two publishers:
#
# - a push of a version tag (v*) publishes the full, immutable stable release;
# - a push to main publishes canary: the same binaries, on the one persistent
#   `canary` tag and its (reused, never recreated) prerelease.
#
# Both channels publish `apkscope-update.json`, the manifest `apkscope upgrade`
# discovers updates through — the canary publisher removes the old manifest
# before replacing binaries and uploads the new one last, so a client either
# sees the previous complete build or the new complete build, never a mix.
#
# The build matrix is shared by both channels: every platform the stable
# release ships is built for canary too, no reduced copy. Linux ships two
# binaries per arch — the glibc build with the viewer, the CLI and the MCP
# server together (also packaged as .deb and AppImage), and the static musl
# CLI + MCP server for servers, containers and Alpine (no viewer there: a
# fully static binary cannot dlopen() the desktop's X11/Wayland/GL stack, and
# the binary says so when asked). Windows ships the viewer exe per arch,
# macOS both arches of the CLI + MCP build. The gate job tests and lints the
# code before any artifact is built, so a broken tag wastes no matrix compute.
#
# Version prerelease tags ("-" in the name, e.g. v0.9.1-rc.1) publish as
# pre-releases and never become the latest stable release.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # no workflow_dispatch on purpose: a manual run on a branch ref would make
  # the release job publish a GitHub Release from a non-tag ref. Validate
  # release changes on a fork with a throwaway v* tag instead.

# canary publishes must not be cancelled halfway through: a cancelled run could
# leave the persistent release without a manifest, and every client would fail
# closed until the next push. New runs queue behind the current publish
# (superseded tag re-pushes included — they publish after, never mid-run).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# least privilege everywhere; only the publish job needs contents:write
# to create the GitHub Release and attach the binaries.
permissions:
  contents: read

env:
  # build identity embedded into every binary (`apkscope --version --json`):
  # the channel this build will be published on, and the exact commit. A pull
  # request never runs this workflow (ci.yml covers those); a local build gets
  # neither and identifies as dev.
  APKSCOPE_BUILD_CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || 'canary' }}
  APKSCOPE_GIT_SHA: ${{ github.sha }}
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 5
  # rust-cache sets this anyway; making it explicit keeps any uncached
  # local run consistent with what CI does.
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    # The code is tested and linted before any artifact is built, so a broken
    # tag wastes no matrix compute.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # same key the ci workflow's check job uses. Cache visibility is
          # ref-scoped: a tag run restores caches saved by default-branch
          # runs and caches this tag itself saved on a re-push; caches saved
          # on feature branches do not reach it. Worst case it compiles
          # cold, and it saves the caches for the next tag.
          shared-key: lint-check
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      # CLI + MCP server only — the macOS/musl configuration
      - run: cargo clippy --locked --workspace --no-default-features -- -D warnings
      # default features: the viewer build the Linux and Windows releases ship
      - run: cargo clippy --locked --workspace -- -D warnings
      # dev profile keeps debug assertions and overflow checks; the GUI tests
      # are pure logic and need no display
      - run: cargo test --locked --workspace --no-default-features
      - run: cargo test --locked --workspace

  linux:
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # build-<runner>: same keys as the ci workflow's build matrix, so
          # default-branch runs warm these jobs. Cache visibility is
          # ref-scoped: a tag run restores default-branch and same-tag
          # caches only, so the first tag after a feature branch still
          # compiles cold (and saves for the next tag); the aarch64 leg's
          # cache (build-ubuntu-24.04-arm) is only ever written here —
          # release.yml is the sole workflow on arm Linux.
          shared-key: build-${{ matrix.runner }}
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # rust-toolchain.toml installs the compiler but not cross targets
      - run: rustup target add ${{ matrix.arch }}-unknown-linux-musl
      # the desktop binary, like the Windows exe: viewer + CLI + MCP server
      # in one. It links libc, libm and libgcc only — the GUI stack is
      # dlopen()'d at runtime. Built on Ubuntu 24.04 (glibc 2.39), the
      # actual glibc floor of these binaries and the AppImage. Each arch
      # builds on its own runner: the viewer's glibc build would need a
      # cross sysroot otherwise, and musl-tools only ships the host's musl-gcc.
      - run: cargo build --locked --workspace --release
      - run: |
          mkdir -p dist
          cp target/release/apkscope dist/apkscope_linux_${{ matrix.arch }}
      # the same binary, packaged: .deb for Debian/Ubuntu, AppImage as a
      # portable format for distros whose glibc meets the floor above
      - run: packaging/linux/package.sh target/release/apkscope dist
      # the fully static CLI + MCP server for servers, containers and musl
      # distros (Alpine); no viewer — a static binary cannot dlopen() the
      # desktop's X11/Wayland/GL stack, and the binary says so when asked
      - run: cargo build --locked --workspace --release --no-default-features --target ${{ matrix.arch }}-unknown-linux-musl
        # both arches' pairs are declared because expressions in env var names
        # are not a documented feature; cargo reads only the pair matching the
        # --target above and ignores the other
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - run: cp target/${{ matrix.arch }}-unknown-linux-musl/release/apkscope dist/apkscope_linux_musl_${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  macos:
    needs: [gate]
    # pinned, not latest: releases must build against a known macOS/Xcode
    # combo, not whatever macos-latest silently moved to
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # the oldest macOS the prebuilt Rust toolchain supports today; raise or
      # lower deliberately and test on the target version
      MACOSX_DEPLOYMENT_TARGET: "12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # same key as the ci workflow's macos build-matrix job; ref-scoped
          # like the linux one — default-branch and same-tag caches only
          shared-key: build-macos-latest
          cache-on-failure: true
      # rust-toolchain.toml installs the compiler but not cross targets
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # arm64 native, x86_64 cross with the Apple toolchain; both are the
      # shipped macOS configuration (CLI + MCP server only)
      - run: cargo build --locked --workspace --release --no-default-features --target aarch64-apple-darwin
      - run: cargo build --locked --workspace --release --no-default-features --target x86_64-apple-darwin
      - run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/apkscope dist/apkscope_macos_aarch64
          cp target/x86_64-apple-darwin/release/apkscope dist/apkscope_macos_x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos
          path: dist/
          if-no-files-found: error

  windows:
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-latest }
          - { arch: aarch64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    # one binary per arch — viewer + CLI + MCP server — built where it runs,
    # like the Linux job: no cross toolchain, each arch compiles on its own runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # same key as the ci workflow's build matrix (`build-<os>`); the
          # x64 leg shares the tested runner's cache, the arm64 leg keeps
          # its own — ref-scoped like the linux one
          shared-key: build-${{ matrix.runner }}
          cache-on-failure: true
      - run: cargo build --locked --workspace --release
      # canonical lowercase Cargo output path; bash handles the copy like POSIX CI
      - shell: bash
        run: |
          mkdir -p dist
          cp target/release/apkscope.exe dist/apkscope_windows_${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # one publisher for both channels. Runs the platform jobs to completion
  # first: a failed build prevents publication on either channel.
  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # no token leakage into later steps, and full history: the canary
          # tag is force-moved to the exact built commit
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # exact expected asset set for a stable tag — the public contract; a
      # missing or extra file fails the release before anything is published.
      # The .deb/AppImage names embed the Cargo.toml version, so a tag that
      # disagrees with Cargo.toml fails here too: the implicit version check.
      - name: Verify the complete asset manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          mapfile -t expected <<EOF
          apkscope_linux_x86_64
          apkscope_linux_musl_x86_64
          apkscope_linux_aarch64
          apkscope_linux_musl_aarch64
          apkscope_${v}_amd64.deb
          apkscope_${v}_arm64.deb
          apkscope-${v}-x86_64.AppImage
          apkscope-${v}-aarch64.AppImage
          apkscope_macos_aarch64
          apkscope_macos_x86_64
          apkscope_windows_x86_64.exe
          apkscope_windows_aarch64.exe
          EOF
          missing=0
          for f in "${expected[@]}"; do
            [ -f "dist/$f" ] || { echo "::error::missing release asset dist/$f"; missing=1; }
          done
          # nothing else may ride along
          for f in dist/*; do
            base=$(basename "$f")
            case " ${expected[*]} " in
              *" $base "*) ;;
              *) echo "::error::unexpected file in dist/: $base"; missing=1 ;;
            esac
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "manifest ok:"; ls -l dist
      - name: Checksums and update manifest
        env:
          CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || 'canary' }}
          COMMIT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          # the .deb/AppImage names embed the Cargo.toml version — the same
          # source the canary manifest version below uses
          pkgv=$(awk -F'"' '/^version = "/{print $2; exit}' ../Cargo.toml)
          # deterministic order; covers every shipped artifact
          sha256sum apkscope_linux_x86_64 apkscope_linux_musl_x86_64 \
                    apkscope_linux_aarch64 apkscope_linux_musl_aarch64 \
                    apkscope_windows_x86_64.exe apkscope_windows_aarch64.exe \
                    apkscope_macos_aarch64 apkscope_macos_x86_64 \
                    "apkscope_${pkgv}_amd64.deb" "apkscope_${pkgv}_arm64.deb" \
                    "apkscope-${pkgv}-x86_64.AppImage" "apkscope-${pkgv}-aarch64.AppImage" \
                    > checksums.txt
          cat checksums.txt
          # the manifest `apkscope upgrade` reads: every executable asset with
          # its exact size and SHA-256, plus the build's channel, version and
          # full commit. jq builds it from the actual files in this directory,
          # so it can never describe a stale or missing asset.
          # version: the tag (v0.10.0 -> 0.10.0) for stable, the Cargo package
          # version for canary — a canary never invents a SemVer suffix; its
          # identity is the commit.
          if [ "$CHANNEL" = stable ]; then
            version=$(echo "$REF_NAME" | sed 's/^v//')
          else
            version=$pkgv
          fi
          manifest=$(mktemp)
          echo '{' > "$manifest"
          echo '  "schema_version": 1,' >> "$manifest"
          echo "  \"channel\": \"$CHANNEL\"," >> "$manifest"
          echo "  \"version\": \"$version\"," >> "$manifest"
          echo "  \"commit\": \"$COMMIT\"," >> "$manifest"
          echo '  "assets": {' >> "$manifest"
          first=1
          for entry in \
            'linux-x86_64-gnu apkscope_linux_x86_64' \
            'linux-aarch64-gnu apkscope_linux_aarch64' \
            'linux-x86_64-musl apkscope_linux_musl_x86_64' \
            'linux-aarch64-musl apkscope_linux_musl_aarch64' \
            'windows-x86_64 apkscope_windows_x86_64.exe' \
            'windows-aarch64 apkscope_windows_aarch64.exe' \
            'macos-aarch64 apkscope_macos_aarch64' \
            'macos-x86_64 apkscope_macos_x86_64'
          do
            set -- $entry
            platform=$1; file=$2
            size=$(stat -c%s "$file")
            sha=$(awk -v f="$file" '$2 == f {print $1}' checksums.txt)
            [ $first = 1 ] || echo ',' >> "$manifest"
            first=0
            printf '    "%s": {"name": "%s", "size": %s, "sha256": "%s"}' \
              "$platform" "$file" "$size" "$sha" >> "$manifest"
          done
          echo '' >> "$manifest"
          echo '  }' >> "$manifest"
          echo '}' >> "$manifest"
          jq . "$manifest" > apkscope-update.json
          rm "$manifest"
          cat apkscope-update.json

      # --- canary: reuse the persistent release, overwrite its assets,
      # manifest first-removed / last-uploaded. ------------------------------
      - name: Move the canary tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "release-bot"
          git config user.email "actions@users.noreply.github.com"
          git tag --force canary "$GITHUB_SHA"
          git push --force origin refs/tags/canary
      - name: Take the old manifest offline (clients fail closed meanwhile)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release (or its manifest asset) may not exist yet on the very
          # first canary publish; both are fine to skip
          gh release delete-asset canary apkscope-update.json --repo "$GITHUB_REPOSITORY" --yes || true
      - name: Skip stale builds (a newer main commit already published)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # re-check immediately before publishing: this workflow's commit must
          # still be main's HEAD, or an older run (queued behind a publish)
          # would overwrite a newer canary
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved to $head; skipping this stale canary build" >&2
            echo "stale=true" >> "$GITHUB_ENV"
          fi
      - name: Publish canary
        if: github.ref == 'refs/heads/main' && env.stale != 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: canary
          name: APKScope Canary
          prerelease: true
          make_latest: false
          overwrite_files: true
          preserve_order: true
          files: |
            dist/apkscope*
            dist/checksums.txt
            dist/apkscope-update.json
          fail_on_unmatched_files: true

      # --- stable: the full versioned release, published once, never
      # overwritten. ---------------------------------------------
      # prerelease only for real pre-release suffixes (-rc.1, -beta.1, ...),
      # not for any hyphen anywhere in the tag
      - name: Decide prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish stable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/apkscope*
            dist/*.deb
            dist/*.AppImage
            dist/checksums.txt
            dist/apkscope-update.json
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.prerelease.outputs.prerelease == 'true' }}
