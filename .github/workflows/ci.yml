name: ci

# Quality gate + cross-platform cargo test/build matrix.
#
# Runs on every branch push and pull request. Tag pushes (v*) are
# excluded: release.yml handles release tags with its own inline lint
# gate -> build matrix, so we don't duplicate work on every release.
#
# Pipeline (all jobs run in parallel unless they need each other):
#   fmt     - cargo fmt --check (fast, no compile)
#   check   - cargo check on the CLI + MCP build (the --no-default-features
#             config the Linux/macOS release binaries are built with)
#   clippy  - cargo clippy with -D warnings on the same build
#   build   - cargo test + build matrix on linux/macos/windows
#
# All actions pinned to Node 24-compatible major versions (Node 20 was
# removed from GitHub-hosted runners on 2026-09-23).
#   https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # CLI + MCP server only — matches the Linux/macOS release build
      - run: cargo check --release --no-default-features

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Lint with -D warnings, but allow a few categories that need per-site
      # judgment on the existing codebase (tracked for follow-up cleanup):
      #   -A dead_code                  — 17 unused pub fns/types; need API-surface review
      #   -A clippy::collapsible_if     — 52 sites; collapsing often hurts readability
      #   -A clippy::type_complexity    — 9 sites; subjective, code may be clearer inline
      #   -A clippy::too_many_arguments — 2 sites; refactor risk
      #   -A clippy::chunks_exact_to_as_chunks — 7 sites; needs verification
      #   -A clippy::needless_range_loop, explicit_counter_loop — judgment calls
      - run: cargo clippy --release --no-default-features -- -D warnings
          -A dead_code
          -A clippy::collapsible_if
          -A clippy::type_complexity
          -A clippy::too_many_arguments
          -A clippy::chunks_exact_to_as_chunks
          -A clippy::needless_range_loop
          -A clippy::explicit_counter_loop

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64, optional: true }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    # macOS arm64 runners are often unavailable (GitHub capacity); don't fail the run for that
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # CLI + MCP server, no GUI libraries needed
      - run: cargo test --release --no-default-features
      - run: cargo build --release --no-default-features
      - uses: actions/upload-artifact@v5
        with:
          name: apkscope-cli-${{ matrix.name }}
          path: |
            target/release/apkscope
            target/release/apkscope.exe
          if-no-files-found: ignore
      # the viewer builds on Windows (where it is tested)
      - if: matrix.os == 'windows-latest'
        run: cargo build --release
