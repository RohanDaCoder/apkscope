name: ci

# Pre-merge gate for every branch and PR. Release tags (v*) are built and
# published by release.yml instead; this workflow ignores them so a release
# build never runs twice.

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

# One run per ref; the older PR run is cancelled, never a branch push.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 5
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
      # CLI + MCP server only — the macOS/musl configuration
      - run: cargo check --locked --workspace --no-default-features
      # default features: viewer + CLI + MCP server (the Linux/Windows build)
      - run: cargo check --locked --workspace

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
      - run: cargo clippy --locked --workspace --no-default-features -- -D warnings
      - run: cargo clippy --locked --workspace -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
      # dev profile keeps debug assertions and overflow checks; the GUI tests
      # are pure logic and need no display
      - run: cargo test --locked --workspace --no-default-features
      - run: cargo test --locked --workspace

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # optional: macOS arm64 runners are often on outage from GitHub itself
          - { os: macos-latest, name: macos-arm64, optional: true }
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-${{ matrix.name }}
      # build what the release ships: macOS the CLI + MCP server, Linux and
      # Windows the viewer build
      - if: runner.os == 'macOS'
        run: cargo build --locked --workspace --release --no-default-features
      - if: runner.os != 'macOS'
        run: cargo build --locked --workspace --release
      - name: Copy binary (posix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/apkscope dist/apkscope-bin
      - name: Copy binary (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/apkscope.exe dist/apkscope-bin.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apkscope-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
      # the static CLI + MCP server on Linux, like the release
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # rust-toolchain.toml installs the compiler but not cross targets
      - if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-musl
      - if: runner.os == 'Linux'
        run: cargo build --locked --workspace --release --no-default-features --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      # the Linux binaries, packaged like the release (.deb + AppImage)
      - if: runner.os == 'Linux'
        run: |
          mkdir -p pkg
          cp target/release/apkscope pkg/apkscope_linux_x86_64
          cp target/x86_64-unknown-linux-musl/release/apkscope pkg/apkscope_linux_musl_x86_64
          packaging/linux/package.sh target/release/apkscope pkg
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apkscope-packages-linux-x64
          path: pkg/
          if-no-files-found: error
