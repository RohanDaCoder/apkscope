name: ci

# Pre-merge gate for every branch and PR. Release tags (v*) are built and
# published by release.yml instead; this workflow ignores them so a release
# build never runs twice.

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
    # docs-only pushes do not touch any Rust code, and no CI job compiles
    # markdown: skipping the 3-OS matrix for them saves the full run.
    paths-ignore:
      - "docs/**"
      - "bench/**"
      - "*.md"
      - "assets/logo.py"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    # same scope on PRs: the filter applies to the changed files of the
    # PR, so docs-only PRs skip the build matrix as well. Careful: paths
    # filters on pull_request use the PR's diff, so any code change in a
    # mixed docs+code PR still runs the full matrix.
    paths-ignore:
      - "docs/**"
      - "bench/**"
      - "*.md"
      - "assets/logo.py"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:
    # manual re-run without the path filters, for exactly the mixed
    # docs+code case above or when a skipped run needs a forced run

# least privilege; the workflow never writes to the repo, so the default
# read/write token would be pure risk surface. Overridden only where a
# job must write (none here; release.yml grants its release job contents:write).
permissions:
  contents: read

# One run per ref; the older PR run is cancelled, never a branch push.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 5
  # rust-cache sets this anyway; making it explicit keeps any uncached
  # local run consistent with what CI does.
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint-check
          cache-on-failure: true
      # CLI + MCP server only — the macOS/musl configuration
      - run: cargo check --locked --workspace --no-default-features
      # default features: viewer + CLI + MCP server (the Linux/Windows build)
      - run: cargo check --locked --workspace

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint-clippy
          cache-on-failure: true
      - run: cargo clippy --locked --workspace --no-default-features -- -D warnings
      - run: cargo clippy --locked --workspace -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          cache-on-failure: true
      # dev profile keeps debug assertions and overflow checks; the GUI tests
      # are pure logic and need no display
      - run: cargo test --locked --workspace --no-default-features
      - run: cargo test --locked --workspace

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # optional: macOS arm64 runners are often on outage from GitHub itself
          - { os: macos-latest, name: macos-arm64, optional: true }
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # one cache per OS: the target dir is not portable between
          # Linux/macOS/Windows dependency builds. release.yml reuses the
          # same shared-keys per platform. Cache visibility is ref-scoped:
          # caches saved here on the default branch reach later tag runs;
          # caches saved on a feature branch stay on that branch (and
          # PR-event runs save under the merge ref, restorable only by
          # that PR itself) — worst case a job compiles cold once.
          shared-key: build-${{ matrix.os }}
          cache-on-failure: true
      # cross-platform test coverage of the CLI + MCP configuration; the
      # ubuntu-only test job above covers both feature sets
      - run: cargo test --locked --release --no-default-features
      # build what the release ships: macOS the CLI + MCP server, Linux and
      # Windows the viewer build
      - if: runner.os == 'macOS'
        run: cargo build --locked --workspace --release --no-default-features
      - if: runner.os != 'macOS'
        run: cargo build --locked --workspace --release
      - name: Copy binary (posix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/apkscope dist/apkscope-bin
      - name: Copy binary (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/apkscope.exe dist/apkscope-bin.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apkscope-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
      # the static CLI + MCP server on Linux, like the release
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # rust-toolchain.toml installs the compiler but not cross targets
      - if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-musl
      - if: runner.os == 'Linux'
        run: cargo build --locked --workspace --release --no-default-features --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      # the Linux binaries, packaged like the release (.deb + AppImage)
      - if: runner.os == 'Linux'
        run: |
          mkdir -p pkg
          cp target/release/apkscope pkg/apkscope_linux_x86_64
          cp target/x86_64-unknown-linux-musl/release/apkscope pkg/apkscope_linux_musl_x86_64
          packaging/linux/package.sh target/release/apkscope pkg
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apkscope-packages-linux-x64
          path: pkg/
          if-no-files-found: error
