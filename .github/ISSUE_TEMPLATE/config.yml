blank_issues_enabled: false
contact_links:
  - name: Question / usage help
    url: https://github.com/suffixing/apkscope/blob/main/README.md
    about: >
      Most answers are in the README — the command list, the MCP setup and the honest-limits
      section. Check `apkscope --help` too; it lists every flag. For anything else, open a
      feature request and say it's a question.
  - name: Security issue with apkscope itself
    url: https://github.com/suffixing/apkscope/security/advisories
    about: >
      Don't post exploit-grade details in public issues. Use private reporting on the Security
      tab if enabled, or contact the maintainer directly.
